<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="1200" height="680">
  <defs>
    <filter id="pillShadow" x="-20%" y="-20%" width="150%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#081844" flood-opacity="0.18"/>
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#081844" flood-opacity="0.10"/>
    </filter>
    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
  </defs>

  <!-- Taxes & Fees (Slanted Top-Right) -->
  <g transform="translate(415, 75) rotate(24)">
    <rect x="-95" y="-24" width="190" height="48" rx="24" ry="24" fill="url(#pillGrad)" filter="url(#pillShadow)"/>
    <text x="0" y="6" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="18" font-weight="600" fill="#1E293B" text-anchor="middle" letter-spacing="-0.01em">Taxes &amp; Fees</text>
  </g>

  <!-- Marketing (Top-Left) -->
  <g transform="translate(210, 105)">
    <rect x="-85" y="-24" width="170" height="48" rx="24" ry="24" fill="url(#pillGrad)" filter="url(#pillShadow)"/>
    <text x="0" y="6" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="18" font-weight="600" fill="#1E293B" text-anchor="middle" letter-spacing="-0.01em">Marketing</text>
  </g>

  <!-- Income (Center) -->
  <g transform="translate(330, 172)">
    <rect x="-68" y="-23" width="136" height="46" rx="23" ry="23" fill="url(#pillGrad)" filter="url(#pillShadow)"/>
    <text x="0" y="6" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="18" font-weight="600" fill="#1E293B" text-anchor="middle" letter-spacing="-0.01em">Income</text>
  </g>

  <!-- Utility (Lower-Left) -->
  <g transform="translate(125, 235)">
    <rect x="-60" y="-22" width="120" height="44" rx="22" ry="22" fill="url(#pillGrad)" filter="url(#pillShadow)"/>
    <text x="0" y="6" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="17" font-weight="600" fill="#1E293B" text-anchor="middle" letter-spacing="-0.01em">Utility</text>
  </g>

  <!-- Rent (Bottom-Left) -->
  <g transform="translate(110, 298)">
    <rect x="-52" y="-22" width="104" height="44" rx="22" ry="22" fill="url(#pillGrad)" filter="url(#pillShadow)"/>
    <text x="0" y="6" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="17" font-weight="600" fill="#1E293B" text-anchor="middle" letter-spacing="-0.01em">Rent</text>
  </g>

  <!-- Software (Middle-Right) -->
  <g transform="translate(485, 235)">
    <rect x="-72" y="-22" width="144" height="44" rx="22" ry="22" fill="url(#pillGrad)" filter="url(#pillShadow)"/>
    <text x="0" y="6" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="17" font-weight="600" fill="#1E293B" text-anchor="middle" letter-spacing="-0.01em">Software</text>
  </g>

  <!-- Operations (Bottom-Right) -->
  <g transform="translate(500, 298)">
    <rect x="-82" y="-22" width="164" height="44" rx="22" ry="22" fill="url(#pillGrad)" filter="url(#pillShadow)"/>
    <text x="0" y="6" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="17" font-weight="600" fill="#1E293B" text-anchor="middle" letter-spacing="-0.01em">Operations</text>
  </g>
</svg>